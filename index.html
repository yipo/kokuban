<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)">
    <meta name="description" content="A quiet space to draw and think. Your board stays in this browser.">
    <title>Kokuban</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <main id="viewport" aria-label="Whiteboard" tabindex="0" aria-busy="true">
      <div id="board">
        <canvas id="drawing" width="2048" height="2048" aria-label="Drawing surface"></canvas>
        <div id="text-layer"></div>
      </div>
    </main>

    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">k.</span><span>Kokuban</span></div>
      <div class="top-actions">
        <span id="save-status" role="status" aria-live="polite">Opening board…</span>
        <button id="install" class="quiet-button" hidden>Install app</button>
        <button id="clear" class="quiet-button" disabled title="Clear drawing and text">Clear board</button>
      </div>
    </header>

    <div id="tools" class="toolbar tools" role="toolbar" aria-label="Drawing tools">
      <button data-tool="pencil" aria-label="Pencil" aria-pressed="true" title="Pencil" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15z"/></svg>
      </button>
      <button data-tool="eraser" aria-label="Eraser" aria-pressed="false" title="Eraser" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 4 7 7a2 2 0 0 1 0 3l-6 6H8l-5-5a2 2 0 0 1 0-3l7-8a2 2 0 0 1 3 0ZM7 8l10 10M13 20h8"/></svg>
      </button>
      <span class="toolbar-divider"></span>
      <button data-tool="text" aria-label="Text" aria-pressed="false" title="Text" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7V4h14v3M12 4v16M8 20h8"/></svg>
      </button>
    </div>

    <div id="sizes" class="toolbar sizes" role="toolbar" aria-label="Pencil size">
      <button data-size="0" aria-label="Small" aria-pressed="false" disabled><span class="size-dot small"></span></button>
      <button data-size="1" aria-label="Medium" aria-pressed="true" disabled><span class="size-dot medium"></span></button>
      <button data-size="2" aria-label="Large" aria-pressed="false" disabled><span class="size-dot large"></span></button>
    </div>

    <footer class="footer"><span>Scroll to zoom <span class="separator">·</span> Right-drag to move</span><output id="zoom" aria-label="Zoom level">100%</output></footer>
    <noscript>Kokuban needs JavaScript enabled to draw and save your board.</noscript>
  </body>
</html>
