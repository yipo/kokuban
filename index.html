<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)">
    <meta name="description" content="A quiet space to draw and think. Your board stays in this browser.">
    <title>Kokuban</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <main id="viewport" aria-label="Whiteboard" tabindex="0" aria-busy="true">
      <div id="board">
        <canvas id="drawing" width="2048" height="2048" aria-label="Drawing surface"></canvas>
        <div id="text-layer"></div>
      </div>
    </main>

    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">k.</span><span>Kokuban</span></div>
      <div class="top-actions">
        <span id="save-status" role="status" aria-live="polite">Opening board…</span>
        <button id="install" class="quiet-button" hidden>Install app</button>
      </div>
    </header>

    <div id="tools" class="toolbar tools" role="toolbar" aria-label="Boards and drawing tools">
      <button id="new-board" aria-label="New board" title="New board" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H5v18h14V8zM14 3v5h5M8 14h8M12 10v8"/></svg>
      </button>
      <button id="open-board" aria-label="Open board" title="Open board" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V4h7l3 3h8v13H3zM3 10h18"/></svg>
        <span id="board-count" aria-hidden="true" hidden></span>
      </button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button data-tool="pencil" aria-label="Pencil" aria-pressed="true" title="Pencil" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15z"/></svg>
      </button>
      <button data-tool="eraser" aria-label="Eraser" aria-pressed="false" title="Eraser" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 4 7 7a2 2 0 0 1 0 3l-6 6H8l-5-5a2 2 0 0 1 0-3l7-8a2 2 0 0 1 3 0ZM7 8l10 10M13 20h8"/></svg>
      </button>
      <span class="toolbar-divider"></span>
      <button data-tool="text" aria-label="Text" aria-pressed="false" title="Text" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7V4h14v3M12 4v16M8 20h8"/></svg>
      </button>
    </div>

    <div id="sizes" class="toolbar sizes" role="toolbar" aria-label="Pencil size and pencil color">
      <button data-size="0" aria-label="Small" aria-pressed="false" disabled><span class="size-dot small"></span></button>
      <button data-size="1" aria-label="Medium" aria-pressed="true" disabled><span class="size-dot medium"></span></button>
      <button data-size="2" aria-label="Large" aria-pressed="false" disabled><span class="size-dot large"></span></button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="color-toggle" aria-label="Pencil color" aria-expanded="false" aria-controls="colors" hidden disabled>
        <span class="color-swatch" aria-hidden="true"></span>
        <span class="color-chevron" aria-hidden="true">▾</span>
      </button>
      <div id="colors" class="color-palette" role="group" aria-label="Pencil color"></div>
    </div>

    <div id="text-actions" role="toolbar" aria-label="Selected text" hidden>
      <button class="quiet-button" data-action="done">Done</button>
      <button class="quiet-button" data-action="delete">Delete text</button>
    </div>
    <dialog id="board-picker" aria-labelledby="board-picker-title">
      <h2 id="board-picker-title">Saved boards</h2>
      <p class="board-picker-hint">Select a board to load or remove.</p>
      <p class="board-picker-error" role="alert" hidden></p>
      <div class="board-list" role="radiogroup" aria-label="Saved boards"></div>
      <div class="board-picker-actions">
        <button class="quiet-button" data-action="remove" disabled>Remove</button>
        <span></span>
        <button class="quiet-button" data-action="close">Close</button>
        <button class="quiet-button" data-action="load" disabled>Load</button>
      </div>
    </dialog>
    <footer class="footer"><span class="mouse-hint">Scroll to zoom <span class="separator">·</span> Right-drag to move</span><span class="touch-hint">One finger to draw <span class="separator">·</span> Two to move &amp; zoom</span><output id="zoom" aria-label="Zoom level">100%</output></footer>
    <noscript>Kokuban needs JavaScript enabled to draw and save your board.</noscript>
  </body>
</html>
